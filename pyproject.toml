[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "punting-warehouse"
version = "0.1.0"
description = "Raw racing warehouse and secure WA form analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "jinja2>=3.1,<4", "alembic>=1.14,<2"
]
[project.optional-dependencies]
build = ["setuptools>=75", "wheel>=0.45"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[project.scripts]
punting = "punting.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
punting = ["templates/*.html", "static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
